
name: FUTURE RADAR 50 - MARKET UNIVERSE TEST

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install websocket
        run: pip install websocket-client

      - name: Collect Futures Market Tickers
        run: |
          python - <<'PY'
          import websocket
          import json
          import time
          from datetime import datetime, timezone

          URL = "wss://fstream.binance.com/market/stream"
          DURATION = 90

          market = {}
          message_count = 0
          ticker_count = 0
          subscription_ok = False

          print("=" * 60)
          print("FUTURE RADAR 50 - MARKET UNIVERSE TEST")
          print("=" * 60)

          ws = websocket.create_connection(URL, timeout=20)
          ws.settimeout(10)

          print("WEBSOCKET: BAGLANTI BASARILI")

          request = {
              "method": "SUBSCRIBE",
              "params": ["!ticker@arr"],
              "id": 1
          }

          ws.send(json.dumps(request))
          print("TICKER ABONELIGI GONDERILDI")

          start = time.monotonic()

          try:
              while time.monotonic() - start < DURATION:
                  try:
                      raw = ws.recv()
                  except websocket.WebSocketTimeoutException:
                      print("Veri bekleniyor...")
                      continue

                  message = json.loads(raw)
                  message_count += 1

                  if isinstance(message, dict):
                      if message.get("id") == 1:
                          subscription_ok = (
                              message.get("result") is None
                          )
                          print("ABONELIK YANITI:", message)
                          continue

                      if "data" in message:
                          message = message["data"]

                  if isinstance(message, dict):
                      message = [message]

                  if not isinstance(message, list):
                      continue

                  for item in message:
                      if not isinstance(item, dict):
                          continue

                      symbol = item.get("s", "")

                      if not symbol:
                          continue

                      try:
                          price = float(item.get("c", 0))
                          volume = float(item.get("q", 0))
                          change = float(item.get("P", 0))
                      except (ValueError, TypeError):
                          continue

                      if price <= 0:
                          continue

                      market[symbol] = {
                          "symbol": symbol,
                          "price": price,
                          "volume_24h_quote": volume,
                          "change_24h_percent": change,
                          "symbol_type": item.get("st"),
                          "pair": item.get("ps")
                      }

                      ticker_count += 1

          finally:
              ws.close()

          usdt_symbols = [
              item for item in market.values()
              if item["symbol"].endswith("USDT")
          ]

          um_usdt = [
              item for item in usdt_symbols
              if item["symbol_type"] == 1
          ]

          unknown_type = [
              item for item in usdt_symbols
              if item["symbol_type"] is None
          ]

          ranked = sorted(
              usdt_symbols,
              key=lambda x: x["volume_24h_quote"],
              reverse=True
          )

          output = {
              "project": "FUTURE RADAR 50",
              "created_utc": datetime.now(timezone.utc).isoformat(),
              "source": "Binance USD-M Futures WebSocket",
              "stream": "!ticker@arr",
              "subscription_confirmed": subscription_ok,
              "messages_received": message_count,
              "ticker_updates_received": ticker_count,
              "unique_symbols_seen": len(market),
              "unique_usdt_symbols_seen": len(usdt_symbols),
              "usdm_type_1_usdt_candidates": len(um_usdt),
              "unknown_type_usdt_symbols": len(unknown_type),
              "note": "Observed ticker symbols are candidates, not a verified complete perpetual-contract universe.",
              "assets": ranked
          }

          with open(
              "futures_ticker_snapshot.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("\n" + "=" * 60)
          print("TEST SONUCU")
          print("=" * 60)
          print("ABONELIK ONAYI:", subscription_ok)
          print("MESAJ SAYISI:", message_count)
          print("TICKER GUNCELLEMESI:", ticker_count)
          print("GORULEN FARKLI SEMBOL:", len(market))
          print("GORULEN USDT SEMBOL:", len(usdt_symbols))
          print("USD-M TIP 1 USDT ADAYI:", len(um_usdt))
          print("TURU BILINMEYEN USDT:", len(unknown_type))

          print("\nEN YUKSEK HACIMLI ILK 20 USDT SEMBOL:")
          print("-" * 60)

          for i, item in enumerate(ranked[:20], 1):
              print(
                  f"{i:02d}. {item['symbol']:<16}"
                  f"Fiyat: {item['price']:<16}"
                  f"Hacim: {item['volume_24h_quote']:,.0f} USDT"
              )

          print("\nJSON: futures_ticker_snapshot.json")

          if not subscription_ok or not market:
              raise SystemExit("TICKER VERISI DOGRULANAMADI")

          print("\nSONUC: PIYASA TICKER VERISI BASARILI")
          PY

      - name: Save market snapshot
        uses: actions/upload-artifact@v4
        with:
          name: future-radar-market-snapshot
          path: futures_ticker_snapshot.json
