
name: FUTURE RADAR 50 - MARKET DATA TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Test OKX market data
        run: |
          python -c "from market_data import fetch_all_timeframes; data = fetch_all_timeframes('BTC-USDT-SWAP'); print('\nTEST BASARILI'); print('Zaman dilimleri:', list(data.keys()))"
