
name: FUTURE RADAR 50 - SCENARIO VALIDATION

on:
  workflow_dispatch:
  push:
    paths:
      - "scenario_validation.py"
      - "indicator_engine.py"
      - ".github/workflows/scenario-validation.yml"

jobs:
  scenario-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas

      - name: Run scenario validation
        run: python scenario_validation.py
