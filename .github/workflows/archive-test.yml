
name: FUTURE RADAR 50 - SIX MONTH DATA TEST

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Python Hazirla
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Alti Aylik Gecmis Veriyi Kontrol Et
        run: |
          python - <<'PY'
          import urllib.request
          import zipfile
          import io
          import csv

          SYMBOL = "BTCUSDT"

          MONTHS = [
              "2026-05",
              "2026-06",
              "2026-07",
              "2026-08",
              "2026-09",
              "2026-10"
          ]

          INTERVALS = ["5m", "15m", "1h", "4h", "1d"]

          BASE = (
              "https://data.binance.vision/data/"
              "futures/um/monthly/klines"
          )

          MIN_CANDLES = 120

          print("=" * 65)
          print("FUTURE RADAR 50 - SIX MONTH DATA TEST")
          print("=" * 65)

          results = {}
          all_success = True

          for interval in INTERVALS:

              print("\nZAMAN DILIMI:", interval)

              candles = {}

              for month in MONTHS:

                  filename = (
                      f"{SYMBOL}-{interval}-{month}.zip"
                  )

                  url = (
                      f"{BASE}/{SYMBOL}/{interval}/{filename}"
                  )

                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "FutureRadar50"
                          }
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=45
                      ) as response:
                          content = response.read()

                      with zipfile.ZipFile(
                          io.BytesIO(content)
                      ) as archive:

                          csv_files = [
                              name for name in archive.namelist()
                              if name.endswith(".csv")
                          ]

                          if not csv_files:
                              raise ValueError("CSV bulunamadi")

                          with archive.open(csv_files[0]) as file:

                              reader = csv.reader(
                                  io.TextIOWrapper(
                                      file,
                                      encoding="utf-8"
                                  )
                              )

                              for row in reader:

                                  if len(row) < 6:
                                      continue

                                  if row[0] == "open_time":
                                      continue

                                  try:
                                      timestamp = int(row[0])
                                      values = [
                                          float(row[i])
                                          for i in range(1, 6)
                                      ]

                                      if (
                                          timestamp > 0
                                          and all(
                                              value > 0
                                              for value in values
                                          )
                                      ):
                                          candles[timestamp] = row

                                  except (ValueError, TypeError):
                                      continue

                      print(
                          month,
                          "BASARILI"
                      )

                  except Exception as error:
                      all_success = False

                      print(
                          month,
                          "BASARISIZ:",
                          str(error)
                      )

              count = len(candles)

              results[interval] = count

              print("TOPLAM GERCEK MUM:", count)
              print("GEREKEN MINIMUM:", MIN_CANDLES)

              if count >= MIN_CANDLES:
                  print("VERI YETERLILIGI: BASARILI")
              else:
                  print("VERI YETERLILIGI: YETERSIZ")
                  all_success = False

          print("\n" + "=" * 65)
          print("ALTI AYLIK VERI OZETI")
          print("=" * 65)

          for interval, count in results.items():
              print(
                  f"{interval:<8} : {count:>8} mum"
              )

          if all_success and len(results) == 5:
              print("\nSONUC: BES ZAMAN DILIMI BASARILI")
              print("120 MUM SARTI KARSILANDI")
          else:
              print("\nSONUC: VERI TESTI BASARISIZ")
              raise SystemExit(1)

          PY
