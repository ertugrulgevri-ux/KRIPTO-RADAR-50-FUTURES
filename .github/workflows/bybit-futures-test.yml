
name: BYBIT FUTURES BAGLANTI TESTI

on:
  workflow_dispatch:

jobs:
  bybit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Python Hazirla
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bybit Futures Veri Testi
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.parse
          import json

          host = "https://api.bybit.tr"

          tests = [
              ("/v5/market/time", {}),
              ("/v5/market/tickers",
               {"category": "linear", "symbol": "BTCUSDT"}),
              ("/v5/market/kline",
               {"category": "linear", "symbol": "BTCUSDT",
                "interval": "15", "limit": "2"}),
              ("/v5/market/instruments-info",
               {"category": "linear", "symbol": "BTCUSDT"})
          ]

          success = 0

          for endpoint, params in tests:
              query = urllib.parse.urlencode(params)
              url = host + endpoint
              if query:
                  url += "?" + query

              print("\nTEST:", endpoint)

              try:
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = json.loads(r.read().decode())

                  print("HTTP: 200")
                  print("RET CODE:", data.get("retCode"))
                  print("MESSAGE:", data.get("retMsg"))

                  if data.get("retCode") == 0:
                      success += 1
                      print("SONUC: BASARILI")
                      print("VERI:", str(data.get("result"))[:500])
                  else:
                      print("SONUC: API HATASI")

              except Exception as e:
                  print("BAGLANTI HATASI:", str(e))

          print("\nBASARILI TEST:", success, "/", len(tests))

          if success == len(tests):
              print("BYBIT FUTURES BAGLANTISI BASARILI")
          else:
              print("BAGLANTI TAM OLARAK DOGRULANAMADI")

          PY
