
name: FUTURE RADAR 50 - LIVE KLINE TEST

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install websocket
        run: pip install websocket-client

      - name: Binance New WebSocket Test
        run: |
          python - <<'PY'
          import json
          import websocket
          import sys
          import time

          url = "wss://fstream.binance.com/market/stream"

          print("=" * 55)
          print("BINANCE YENI FUTURES WEBSOCKET TESTI")
          print("=" * 55)

          ws = None
          received = set()

          try:
              ws = websocket.create_connection(url, timeout=15)
              print("BAGLANTI: BASARILI")

              request = {
                  "method": "SUBSCRIBE",
                  "params": [
                      "btcusdt@aggTrade",
                      "btcusdt@kline_5m"
                  ],
                  "id": 1
              }

              ws.send(json.dumps(request))
              print("ABONELIK ISTEGI GONDERILDI")

              deadline = time.monotonic() + 25

              while time.monotonic() < deadline:
                  try:
                      ws.settimeout(5)
                      message = json.loads(ws.recv())

                      if message.get("id") == 1:
                          print("ABONELIK ONAYI:", message)
                          continue

                      data = message.get("data", message)
                      event = data.get("e")

                      if event == "aggTrade":
                          received.add("aggTrade")
                          print("CANLI ISLEM VERISI ALINDI")
                          print("Fiyat:", data.get("p"))

                      elif event == "kline":
                          received.add("kline")
                          k = data.get("k", {})
                          print("CANLI MUM VERISI ALINDI")
                          print("Kapanis:", k.get("c"))
                          print("Mum kapandi mi:", k.get("x"))

                      if len(received) == 2:
                          break

                  except websocket.WebSocketTimeoutException:
                      print("Veri bekleniyor...")

              print("\nALINAN AKISLAR:", sorted(received))

              if len(received) == 2:
                  print("SONUC: IKI AKIS DA BASARILI")
              else:
                  print("SONUC: EKSIK VERI AKISI")
                  sys.exit(1)

          except Exception as e:
              print("HATA:", repr(e))
              sys.exit(1)

          finally:
              if ws:
                  ws.close()

          PY
