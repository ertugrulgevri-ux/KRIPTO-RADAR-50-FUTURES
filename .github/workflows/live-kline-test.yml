
name: FUTURE RADAR 50 - LIVE KLINE TEST

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install websocket
        run: pip install websocket-client

      - name: Binance Subscription Test
        run: |
          python - <<'PY'
          import json
          import websocket
          import sys

          url = "wss://fstream.binance.com/ws"

          print("=" * 55)
          print("BINANCE FUTURES ABONELIK TESTI")
          print("=" * 55)

          ws = None
          data_received = False
          ack_received = False

          try:
              ws = websocket.create_connection(url, timeout=15)
              print("BAGLANTI: BASARILI")

              request = {
                  "method": "SUBSCRIBE",
                  "params": [
                      "btcusdt@aggTrade",
                      "btcusdt@kline_5m"
                  ],
                  "id": 1
              }

              ws.send(json.dumps(request))
              print("ABONELIK ISTEGI: GONDERILDI")

              ws.settimeout(20)

              for i in range(5):
                  try:
                      message = ws.recv()
                      print("\nSUNUCU YANITI:", message[:700])

                      result = json.loads(message)

                      if result.get("id") == 1 and result.get("result") is None:
                          ack_received = True
                          print("ABONELIK ONAYI: BASARILI")

                      if "e" in result:
                          data_received = True
                          print("CANLI PIYASA VERISI: ALINDI")

                  except websocket.WebSocketTimeoutException:
                      print("\n20 SANİYEDE YENI MESAJ GELMEDI")
                      break

              print("\nABONELIK ONAYI:", ack_received)
              print("PIYASA VERISI:", data_received)

              if not ack_received and not data_received:
                  print("SONUC: ABONELIK VE VERI DOGRULANAMADI")
                  sys.exit(1)

              if data_received:
                  print("SONUC: CANLI VERI BASARILI")
              else:
                  print("SONUC: ABONELIK ONAYLANDI, VERI BEKLENIYOR")

          except Exception as e:
              print("HATA:", repr(e))
              sys.exit(1)

          finally:
              if ws:
                  ws.close()

          PY
