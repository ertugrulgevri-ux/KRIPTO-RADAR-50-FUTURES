
name: FUTURE RADAR 50 - LIVE KLINE TEST

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install websocket
        run: pip install websocket-client

      - name: Binance WebSocket Diagnostic
        run: |
          python - <<'PY'
          import json
          import websocket
          import sys

          streams = [
              (
                  "5 DAKIKALIK MUM",
                  "wss://fstream.binance.com/ws/btcusdt@kline_5m"
              ),
              (
                  "CANLI ISLEM",
                  "wss://fstream.binance.com/ws/btcusdt@aggTrade"
              )
          ]

          received_any = False

          print("=" * 55)
          print("FUTURE RADAR 50 - WEBSOCKET BAGLANTI TESTI")
          print("=" * 55)

          for name, url in streams:
              print("\nTEST:", name)
              print("ADRES:", url)

              ws = None

              try:
                  ws = websocket.create_connection(
                      url,
                      timeout=15
                  )

                  print("WEBSOCKET BAGLANTISI: BASARILI")

                  try:
                      message = ws.recv()
                      data = json.loads(message)

                      print("CANLI VERI: ALINDI")
                      print("VERI:", json.dumps(data)[:500])

                      received_any = True

                  except websocket.WebSocketTimeoutException:
                      print("CANLI VERI: 15 SANİYEDE ALINAMADI")

              except Exception as e:
                  print("BAGLANTI HATASI:", repr(e))

              finally:
                  if ws:
                      try:
                          ws.close()
                      except Exception:
                          pass

          print("\n" + "=" * 55)

          if received_any:
              print("SONUC: EN AZ BIR AKISTAN VERI ALINDI")
          else:
              print("SONUC: CANLI VERI ALINAMADI")
              sys.exit(1)

          print("TEST TAMAMLANDI")
          PY
