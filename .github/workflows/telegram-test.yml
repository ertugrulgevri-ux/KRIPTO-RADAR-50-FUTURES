
name: FUTURE RADAR 50 - TELEGRAM TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest

    steps:
      - name: Telegram Mesaj Testi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          data = {
              "chat_id": chat_id,
              "text": "FUTURE RADAR 50: Telegram bağlantısı başarılı! Sistem mesaj göndermeye hazır."
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read().decode("utf-8"))

          if not result.get("ok"):
              raise RuntimeError("Telegram mesaj gönderimi başarısız.")

          print("TELEGRAM BAGLANTISI BASARILI")
          PY
