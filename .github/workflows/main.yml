
import requests
import json

print("BINANCE FUTURES GERCEK VERI TESTI")

hosts = [
    "https://fapi.binance.com",
    "https://fapi1.binance.com",
    "https://fapi2.binance.com",
    "https://fapi3.binance.com",
    "https://fapi4.binance.com"
]

for host in hosts:
    print("\n" + "=" * 45)
    print("ADRES:", host)

    for endpoint in [
        "/fapi/v1/ping",
        "/fapi/v1/time",
        "/fapi/v1/ticker/price?symbol=BTCUSDT"
    ]:
        try:
            r = requests.get(
                host + endpoint,
                timeout=15,
                headers={"User-Agent": "Mozilla/5.0"}
            )

            print("\nTEST:", endpoint)
            print("HTTP:", r.status_code)
            print("YANIT:", r.text[:400])

            if r.status_code == 200:
                try:
                    data = r.json()
                    print("JSON:", "GECERLI")
                    if "ticker/price" in endpoint:
                        print("BTC FIYATI:", data.get("price"))
                except ValueError:
                    print("JSON GECERSIZ")

        except Exception as e:
            print("BAGLANTI HATASI:", str(e))

