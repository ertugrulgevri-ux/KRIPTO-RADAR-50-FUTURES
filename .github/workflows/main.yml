
name: BINANCE FUTURES KLINE STREAM TEST

on:
  workflow_dispatch:

jobs:
  kline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: WebSocket paketini kur
        run: pip install websocket-client

      - name: Binance Futures mum akisi
        run: |
          python - <<'PY'
          import json
          import websocket

          url = "wss://fstream.binance.com/market/ws/btcusdt@kline_1m"

          print("BINANCE FUTURES KLINE STREAM")
          print("Adres:", url)

          ws = websocket.create_connection(url, timeout=30)

          print("BAGLANTI: BASARILI")

          data = json.loads(ws.recv())

          print("GELEN VERI:")
          print(json.dumps(data, indent=2))

          if data.get("e") == "kline":
              print("MUM AKISI: BASARILI")
              print("Coin:", data["s"])
              print("Zaman dilimi:", data["k"]["i"])
              print("Son fiyat:", data["k"]["c"])
          else:
              print("BEKLENMEYEN VERI")

          ws.close()
          PY






