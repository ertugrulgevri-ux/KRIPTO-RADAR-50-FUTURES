
name: KRIPTO RADAR 50 FUTURES

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  futures-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli paketleri kur
        run: pip install -r requirements.txt

      - name: Binance API baglanti testi
        run: |
          python -c "import requests; r=requests.get('https://fapi.binance.com/fapi/v1/ping', timeout=20); print('HTTP:', r.status_code); print('YANIT:', r.text); r.raise_for_status()"

      - name: Futures taramasini calistir
        run: python radar.py
