
name: BINANCE FUTURES HISTORY TEST

on:
  workflow_dispatch:

jobs:
  history-test:
    runs-on: ubuntu-latest
    steps:
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Binance gecmis mum arsivi testi
        run: |
          python - <<'PY'
          import urllib.request
          import zipfile
          import io
          import csv

          url = "https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/1h/BTCUSDT-1h-2026-10.zip"

          print("BINANCE FUTURES GECMIS VERI TESTI")

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              content = response.read()
              print("HTTP:", response.status)

          print("ZIP BOYUTU:", len(content), "bayt")

          with zipfile.ZipFile(io.BytesIO(content)) as archive:
              csv_name = next(
                  name for name in archive.namelist()
                  if name.endswith(".csv")
              )

              with archive.open(csv_name) as file:
                  reader = csv.reader(
                      io.TextIOWrapper(file, encoding="utf-8")
                  )

                  rows = [next(reader) for _ in range(3)]

          print("GECMIS MUM: BASARILI")
          print("SUTUN SAYISI:", len(rows[0]))
          print("ILK MUM:", rows[0])
          print("IKINCI MUM:", rows[1])
          print("UCUNCU MUM:", rows[2])
          PY






