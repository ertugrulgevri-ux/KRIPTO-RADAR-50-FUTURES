
      - name: Binance Futures veri akisi testi
        run: |
          python - <<'PY'
          import json
          import websocket

          streams = [
              "btcusdt@trade",
              "btcusdt@markPrice@1s"
          ]

          for stream in streams:
              url = "wss://fstream.binance.com/ws/" + stream
              print("\nTEST:", stream)

              try:
                  ws = websocket.create_connection(url, timeout=30)
                  print("BAGLANTI: BASARILI")

                  data = json.loads(ws.recv())
                  print("VERI: BASARILI")
                  print("GELEN VERI:", json.dumps(data)[:500])

                  ws.close()

              except Exception as error:
                  print("TEST HATASI:", str(error))

          PY



