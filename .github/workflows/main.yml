
name: KRIPTO RADAR 50 FUTURES

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  futures-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli paketleri kur
        run: pip install -r requirements.txt

      - name: Binance Futures API erisim testi
        run: |
          python - <<'PY'
          import requests

          urls = [
              "https://fapi.binance.com/fapi/v1/ping",
              "https://fapi.binance.com/fapi/v1/exchangeInfo"
          ]

          for url in urls:
              print("\nTEST:", url)
              try:
                  response = requests.get(url, timeout=30)
                  print("HTTP:", response.status_code)
                  print("YANIT:", response.text[:500])
                  response.raise_for_status()
              except Exception as error:
                  print("BAGLANTI HATASI:", error)
                  raise
          PY

      - name: Futures taramasini calistir
        run: python radar.py
