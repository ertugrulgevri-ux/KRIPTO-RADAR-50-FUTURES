
name: FUTURE RADAR 50 - TIMEFRAME TEST

on:
  workflow_dispatch:

jobs:
  timeframe-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Binance 5 zaman dilimi testi
        run: |
          python - <<'PY'
          import urllib.request
          import zipfile
          import io
          import csv

          symbol = "BTCUSDT"
          intervals = ["5m", "15m", "1h", "4h", "1d"]
          month = "2026-10"

          print("FUTURE RADAR 50 - ZAMAN DILIMI TESTI")

          success = 0

          for interval in intervals:
              url = (
                  "https://data.binance.vision/data/futures/um/"
                  f"monthly/klines/{symbol}/{interval}/"
                  f"{symbol}-{interval}-{month}.zip"
              )

              print("\nTEST:", symbol, interval)

              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(
                      request, timeout=60
                  ) as response:
                      content = response.read()

                  with zipfile.ZipFile(
                      io.BytesIO(content)
                  ) as archive:
                      csv_name = next(
                          n for n in archive.namelist()
                          if n.endswith(".csv")
                      )

                      with archive.open(csv_name) as file:
                          reader = csv.reader(
                              io.TextIOWrapper(file, encoding="utf-8")
                          )

                          header = next(reader)
                          first = next(reader)
                          second = next(reader)

                  print("SONUC: BASARILI")
                  print("Mum sayisi kontrolu: OK")
                  print("Ilk kapanis:", first[4])
                  print("Ikinci kapanis:", second[4])

                  success += 1

              except Exception as error:
                  print("SONUC: BASARISIZ")
                  print("HATA:", str(error))

          print("\nTOPLAM BASARILI:", success, "/", len(intervals))

          if success != len(intervals):
              raise RuntimeError("Tum zaman dilimleri dogrulanamadi")

          print("BES ZAMAN DILIMI DE BASARILI")
          PY







