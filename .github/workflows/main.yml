
name: FUTURE RADAR 50 - FULL MARKET TEST

on:
  workflow_dispatch:

jobs:
  market-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: WebSocket paketi kur
        run: pip install websocket-client

      - name: Binance tam piyasa listesi
        run: |
          python - <<'PY'
          import json
          import websocket

          url = "wss://ws-fapi.binance.com/ws-fapi/v1"

          print("BINANCE TAM FUTURES PIYASA TESTI")

          ws = websocket.create_connection(url, timeout=30)

          request = {
              "id": "radar-full-market",
              "method": "ticker.24hr"
          }

          ws.send(json.dumps(request))
          response = json.loads(ws.recv())
          ws.close()

          print("YANIT DURUMU:", response.get("status"))

          if response.get("status") != 200:
              print(json.dumps(response, indent=2))
              raise RuntimeError("Tam piyasa verisi alinamadi")

          result = response.get("result", [])

          if isinstance(result, dict):
              result = [result]

          usdt = [
              x for x in result
              if x.get("symbol", "").endswith("USDT")
          ]

          usdt.sort(
              key=lambda x: float(x.get("quoteVolume", 0)),
              reverse=True
          )

          print("TOPLAM SOZLESME:", len(result))
          print("USDT SOZLESME:", len(usdt))

          for item in usdt[:20]:
              print(
                  item.get("symbol"),
                  "Fiyat:", item.get("lastPrice"),
                  "Hacim:", item.get("quoteVolume")
              )

          if not usdt:
              raise RuntimeError("USDT sozlesmesi bulunamadi")

          print("TAM PIYASA TESTI: BASARILI")
          PY










