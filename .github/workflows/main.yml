
name: BINANCE FUTURES WEBSOCKET TEST

on:
  workflow_dispatch:

jobs:
  websocket-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: WebSocket paketini kur
        run: pip install websocket-client

      - name: Binance Futures WebSocket baglanti testi
        run: |
          import json
          import websocket

          url = "wss://fstream.binance.com/ws/btcusdt@kline_1m"

          print("BINANCE FUTURES WEBSOCKET TESTI")
          print("Adres:", url)

          try:
              ws = websocket.create_connection(
                  url,
                  timeout=20
              )

              print("BAGLANTI: BASARILI")

              message = ws.recv()
              data = json.loads(message)

              if data.get("e") == "kline":
                  print("VERI: BASARILI")
                  print("Coin:", data["s"])
                  print("Zaman dilimi:", data["k"]["i"])
                  print("Son fiyat:", data["k"]["c"])
                  print("Mum kapandi mi:", data["k"]["x"])
              else:
                  print("BEKLENMEYEN VERI:", data)

              ws.close()

          except Exception as error:
              print("WEBSOCKET HATASI:", str(error))
              raise

