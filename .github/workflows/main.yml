
name: Binance Metadata Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Diagnose Binance Futures API
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.error

          hosts = [
              "https://fapi.binance.com",
              "https://fapi1.binance.com",
              "https://fapi2.binance.com",
              "https://fapi3.binance.com",
              "https://fapi4.binance.com",
          ]

          for host in hosts:
              url = host + "/fapi/v1/exchangeInfo"

              print("\n" + "=" * 50)
              print("TEST:", host)

              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "FUTURE-RADAR-50"}
                  )

                  with urllib.request.urlopen(
                      req, timeout=20
                  ) as response:

                      body = response.read().decode(
                          "utf-8", errors="replace"
                      )

                      print("HTTP:", response.status)
                      print("YANIT:", body[:500])

              except urllib.error.HTTPError as e:
                  print("HTTP HATA:", e.code)
                  print("HATA BASLIGI:", e.reason)

                  try:
                      print(
                          "BINANCE MESAJI:",
                          e.read().decode(
                              "utf-8", errors="replace"
                          )[:1500]
                      )
                  except Exception:
                      print("Hata mesaji okunamadi.")

              except Exception as e:
                  print("BAGLANTI HATASI:", repr(e))

          PY
