
name: FUTURE RADAR 50 - MARKET TEST

on:
  workflow_dispatch:

jobs:
  market-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Binance Futures piyasa testi
        run: |
          python - <<'PY'
          import json
          import websocket
          import time

          url = "wss://fstream.binance.com/market/ws/!ticker@arr"

          print("BINANCE FUTURES PIYASA TESTI")

          ws = websocket.create_connection(url, timeout=20)
          print("BAGLANTI: BASARILI")

          symbols = {}
          start = time.time()

          while time.time() - start < 20:
              try:
                  message = json.loads(ws.recv())

                  if isinstance(message, dict):
                      message = [message]

                  for item in message:
                      symbol = item.get("s", "")
                      if (
                          symbol.endswith("USDT")
                          and item.get("st", 1) == 1
                      ):
                          symbols[symbol] = item

              except Exception as error:
                  print("OKUMA:", str(error))
                  break

          ws.close()

          ranked = sorted(
              symbols.values(),
              key=lambda x: float(x.get("q", 0)),
              reverse=True
          )

          print("\nBULUNAN USDT FUTURES COIN:", len(ranked))

          for item in ranked[:15]:
              print(
                  item["s"],
                  "Fiyat:", item.get("c"),
                  "24s hacim:", item.get("q")
              )

          if not ranked:
              raise RuntimeError("USDT Futures coin verisi bulunamadi")

          print("\nPIYASA VERISI: BASARILI")
          PY








