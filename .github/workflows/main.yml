
name: BINANCE FUTURES WEBSOCKET TEST

on:
  workflow_dispatch:

jobs:
  websocket-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: WebSocket paketini kur
        run: pip install websocket-client

      - name: Binance Futures veri akisi testi
        run: |
          python - <<'PY'
          import json
          import websocket

          streams = [
              "btcusdt@trade",
              "btcusdt@markPrice@1s"
          ]

          for stream in streams:
              url = "wss://fstream.binance.com/ws/" + stream
              print("\nTEST:", stream)

              try:
                  ws = websocket.create_connection(url, timeout=30)
                  print("BAGLANTI: BASARILI")

                  data = json.loads(ws.recv())
                  print("VERI: BASARILI")
                  print("GELEN VERI:", json.dumps(data)[:500])

                  ws.close()

              except Exception as error:
                  print("TEST HATASI:", str(error))

          PY




