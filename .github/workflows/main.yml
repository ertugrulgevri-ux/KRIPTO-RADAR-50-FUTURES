
name: BINANCE FUTURES KLINE TEST

on:
  workflow_dispatch:

jobs:
  kline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: WebSocket paketini kur
        run: pip install websocket-client

      - name: Binance Futures gecmis mum testi
        run: |
          python - <<'PY'
          import json
          import websocket

          url = "wss://ws-fapi.binance.com/ws-fapi/v1"

          request = {
              "id": "radar-test-001",
              "method": "klines",
              "params": {
                  "symbol": "BTCUSDT",
                  "interval": "1m",
                  "limit": 5
              }
          }

          print("BINANCE FUTURES GECMIS MUM TESTI")

          try:
              ws = websocket.create_connection(url, timeout=20)
              print("BAGLANTI: BASARILI")

              ws.send(json.dumps(request))
              response = json.loads(ws.recv())

              print("YANIT:")
              print(json.dumps(response, indent=2))

              if response.get("status") == 200:
                  candles = response.get("result", [])
                  print("MUM VERISI: BASARILI")
                  print("Mum sayisi:", len(candles))

                  if candles:
                      print("Son kapanis fiyati:", candles[-1][4])
              else:
                  print("MUM VERISI BASARISIZ")

              ws.close()

          except Exception as error:
              print("TEST HATASI:", str(error))
              raise
          PY





