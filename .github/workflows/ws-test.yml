
name: FUTURE RADAR 50 - FULL MARKET TEST

on:
  workflow_dispatch:

jobs:
  market-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Python Hazirla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: WebSocket Kur
        run: pip install websocket-client

      - name: Tum Futures Piyasasini Tara
        run: |
          python - <<'PY'
          import websocket
          import json
          import time

          URL = URL = "wss://fstream.binance.com/ws/btcusdt@ticker"

          print("=" * 60)
          print("FUTURE RADAR 50 - FULL MARKET TEST")
          print("=" * 60)

          ws = websocket.create_connection(URL, timeout=15)
          ws.settimeout(5)

          print("BINANCE FUTURES BAGLANTISI: BASARILI")
          print("Piyasa verileri 30 saniye toplanacak...")

          market = {}
          start = time.monotonic()

          while time.monotonic() - start < 30:
              try:
                  raw = ws.recv()
                  data = json.loads(raw)

                  if isinstance(data, dict):
                      data = [data]

                  for item in data:
                      symbol = item.get("s", "")

                      if not symbol.endswith("USDT"):
                          continue

                      try:
                          price = float(item.get("c", 0))
                          volume = float(item.get("q", 0))
                          change = float(item.get("P", 0))

                          if price > 0 and volume > 0:
                              market[symbol] = {
                                  "price": price,
                                  "volume": volume,
                                  "change": change
                              }
                      except (ValueError, TypeError):
                          continue

              except websocket.WebSocketTimeoutException:
                  continue

          ws.close()

          ranked = sorted(
              market.items(),
              key=lambda x: x[1]["volume"],
              reverse=True
          )

          print("\nTOPLAM USDT PARITE:", len(ranked))
          print("\nEN YUKSEK HACIMLI ILK 10")
          print("-" * 60)

          for i, (symbol, item) in enumerate(ranked[:10], 1):
              print(
                  f"{i:02d}. {symbol:<16}"
                  f" Fiyat: {item['price']:<15}"
                  f" Hacim: {item['volume']:,.0f} USDT"
                  f" Degisim: %{item['change']:.2f}"
              )

          print("-" * 60)

          if len(ranked) >= 10:
              print("SONUC: PIYASA VERISI BASARILI")
          else:
              print("SONUC: YETERSIZ VERI")

          print("TEST TAMAMLANDI")
          PY
