
name: FUTURE RADAR 50 - WEBSOCKET DIAGNOSTIC

on:
  workflow_dispatch:

jobs:
  websocket-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Python Hazirla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: WebSocket Kur
        run: pip install websocket-client

      - name: Binance BTCUSDT Veri Testi
        run: |
          python - <<'PY'
          import websocket
          import json
          import time

          URL = "wss://fstream.binance.com/ws/btcusdt@ticker"

          print("=" * 60)
          print("FUTURE RADAR 50 - WEBSOCKET DIAGNOSTIC")
          print("=" * 60)
          print("Adres:", URL)

          try:
              ws = websocket.create_connection(URL, timeout=20)
              print("BAGLANTI: BASARILI")
              print("BTCUSDT verisi bekleniyor...")

              received = 0
              start = time.monotonic()

              while received < 5 and time.monotonic() - start < 60:
                  try:
                      raw = ws.recv()
                      data = json.loads(raw)

                      received += 1

                      print("\nMESAJ:", received)
                      print("HAM VERI:", raw)

                      if isinstance(data, dict):
                          print("SEMBOL:", data.get("s"))
                          print("SON FIYAT:", data.get("c"))
                          print("24 SAAT DEGISIM:", data.get("P"))
                          print("24 SAAT HACIM:", data.get("q"))

                  except websocket.WebSocketTimeoutException:
                      print("Veri bekleniyor...")

              ws.close()

              print("\nALINAN MESAJ SAYISI:", received)

              if received > 0:
                  print("SONUC: BTCUSDT VERISI BASARILI")
              else:
                  print("SONUC: VERI ALINAMADI")

          except Exception as e:
              print("BAGLANTI HATASI:", repr(e))

          print("\nTEST TAMAMLANDI")
          PY
