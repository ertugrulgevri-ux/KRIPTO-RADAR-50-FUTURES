
name: FUTURE RADAR 50 - ASSET CLASSIFICATION

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Python Hazirla
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: WebSocket Kur
        run: pip install websocket-client

      - name: Varliklari Siniflandir
        run: |
          python - <<'PY'
          import websocket
          import json
          import time
          from datetime import datetime, timezone

          URL = "wss://fstream.binance.com/market/stream"
          DURATION = 90

          CRYPTO = set("""
          BTC ETH BNB SOL XRP ADA DOGE TRX LINK AVAX DOT LTC
          BCH UNI AAVE ETC ATOM NEAR FIL APT ARB OP SUI INJ
          ICP VET HBAR SHIB TON ZEC HYPE MMT EVAA ENA BLESS
          ASTER ANT BREV
          """.split())

          STOCKS = set("""
          NVDA SNDK SPCX SKHYNIX MU NBIS MSTR INTC AMD
          GOOGL SAMSUNG MRVL CRCL CRWV LITE DRAM
          """.split())

          ETFS = set("""
          SOXL SOXS TQQQ SQQQ KORU QQQ EWY SPY SNXX
          """.split())

          COMMODITIES = set("""
          XAU XAG CL BZ
          """.split())

          def classify(symbol):
              base = symbol[:-4] if symbol.endswith("USDT") else symbol

              if base.startswith("1000") and base[4:] in CRYPTO:
                  return "Kripto"

              if base in CRYPTO:
                  return "Kripto"
              if base in STOCKS:
                  return "Hisse baglantili"
              if base in ETFS:
                  return "ETF"
              if base in COMMODITIES:
                  return "Emtia"

              return "Dogrulanacak"

          print("=" * 60)
          print("FUTURE RADAR 50 - ASSET CLASSIFICATION")
          print("=" * 60)

          market = {}
          message_count = 0
          ticker_count = 0
          subscription_ok = False

          ws = None

          try:
              ws = websocket.create_connection(URL, timeout=20)
              ws.settimeout(5)

              print("BINANCE BAGLANTISI: BASARILI")

              request = {
                  "method": "SUBSCRIBE",
                  "params": ["!ticker@arr"],
                  "id": 1
              }

              ws.send(json.dumps(request))
              print("ABONELIK ISTEGI GONDERILDI")
              print("90 saniye veri toplanacak...")

              start = time.monotonic()

              while time.monotonic() - start < DURATION:
                  try:
                      raw = ws.recv()
                  except websocket.WebSocketTimeoutException:
                      continue

                  message = json.loads(raw)
                  message_count += 1

                  if isinstance(message, dict):
                      if message.get("id") == 1:
                          subscription_ok = (
                              message.get("result") is None
                          )
                          print("ABONELIK YANITI:", message)
                          continue

                      if "data" in message:
                          message = message["data"]

                  if isinstance(message, dict):
                      message = [message]

                  if not isinstance(message, list):
                      continue

                  for item in message:
                      if not isinstance(item, dict):
                          continue

                      symbol = item.get("s", "")

                      if not symbol.endswith("USDT"):
                          continue

                      try:
                          price = float(item.get("c", 0))
                          volume = float(item.get("q", 0))
                          change = float(item.get("P", 0))
                      except (ValueError, TypeError):
                          continue

                      if price <= 0:
                          continue

                      market[symbol] = {
                          "symbol": symbol,
                          "price": price,
                          "volume_24h_usdt": volume,
                          "change_24h_percent": change
                      }

                      ticker_count += 1

          finally:
              if ws is not None:
                  ws.close()

          ranked = sorted(
              market.values(),
              key=lambda x: x["volume_24h_usdt"],
              reverse=True
          )[:50]

          counts = {}

          for item in ranked:
              kind = classify(item["symbol"])
              item["asset_type"] = kind
              counts[kind] = counts.get(kind, 0) + 1

          output = {
              "project": "FUTURE RADAR 50",
              "created_utc": datetime.now(timezone.utc).isoformat(),
              "source": "Binance USD-M Futures WebSocket",
              "total_symbols_seen": len(market),
              "selected_count": len(ranked),
              "subscription_confirmed": subscription_ok,
              "message_count": message_count,
              "ticker_count": ticker_count,
              "classification_note": (
                  "Known symbol mapping; unverified symbols "
                  "remain marked for review. "
                  "Observed symbols are not a complete exchange universe."
              ),
              "ranking_method": "24h quote volume",
              "assets": ranked,
              "asset_type_counts": counts
          }

          with open(
              "futures_top50.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("\nALINAN MESAJ:", message_count)
          print("TICKER KAYDI:", ticker_count)
          print("TESPIT EDILEN PARITE:", len(market))
          print("SECILEN VARLIK:", len(ranked))

          print("\nVARLIK TURU DAGILIMI:")

          for kind, count in sorted(counts.items()):
              print(kind + ":", count)

          print("\nILK 50 VARLIK:")
          print("-" * 60)

          for i, item in enumerate(ranked, 1):
              print(
                  f"{i:02d}. {item['symbol']:<16}"
                  f"{item['asset_type']:<20}"
                  f"Hacim: {item['volume_24h_usdt']:,.0f} USDT"
              )

          print("\nJSON DOSYASI: futures_top50.json")

          if not subscription_ok:
              raise SystemExit("HATA: WebSocket aboneligi onaylanmadi.")

          if not market:
              raise SystemExit("HATA: Piyasa verisi alinamadi.")

          if len(ranked) < 50:
              print("UYARI: 50 varlik tamamlanamadi.")

          print("\nSONUC: WEBSOCKET VERI TOPLAMA BASARILI")
          PY

      - name: JSON Dosyasini Sakla
        uses: actions/upload-artifact@v4
        with:
          name: future-radar-top50
          path: futures_top50.json
