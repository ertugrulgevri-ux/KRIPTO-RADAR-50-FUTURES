
name: FUTURE RADAR 50 - MULTI SCANNER TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Hazirla
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutuphaneleri Kur
        run: pip install -r requirements.txt

      - name: OKX Piyasa Listesini Olustur
        run: python radar.py

      - name: Ilk 5 Sozlesmeyi Analiz Et
        run: python scanner.py

      - name: Sonuclari Kaydet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: future-radar-50-test-results
          path: |
            futures_universe.json
            futures_scan_results.json
          if-no-files-found: warn
