<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binance Bağlantı Testi</title>
</head>
<body>
<h2>KRİPTO RADAR 50</h2>
<p>Binance Futures bağlantı testi</p>
<pre id="sonuc">Test yapılıyor...</pre>

<script>
async function test() {
  const sonuc = document.getElementById("sonuc");
  try {
    const cevap = await fetch(
      "https://fapi.binance.com/fapi/v1/ticker/price?symbol=BTCUSDT"
    );
    if (!cevap.ok) {
      throw new Error("HTTP " + cevap.status);
    }
    const veri = await cevap.json();
    sonuc.textContent =
      "BAŞARILI\nBTCUSDT fiyatı: " + veri.price;
  } catch (hata) {
    sonuc.textContent =
      "BAŞARISIZ\n" + hata.message;
  }
}
test();
</script>
</body>
</html>
